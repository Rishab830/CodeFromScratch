    import embed
    import zipfile
    platform.window.lessonLoadPhase(2)
    appdir = Path("/data/data/game")
    appdir.mkdir(exist_ok=True)
    async with platform.fopen("game.apk", "rb") as archive:
        with zipfile.ZipFile(archive) as packaged:
            packaged.extractall(appdir.as_posix())
    platform.run_main(PyConfig, loaderhome=appdir / "assets", loadermain=None)
    while embed.counter() < 0:
        await asyncio.sleep(.1)
    await TopLevel_async_handler.start_toplevel(platform.shell, console=False)
    main = appdir / "assets" / "main.py"
    __import__(__name__).__file__ = main
    platform.window.lessonLoadPhase(3)
    await shell.source(main)
    platform.window.transfer.hidden = True
    platform.window.infobox.hidden = True
    platform.window.config.gui_divider = 1
    platform.window.window_resize()

asyncio.run(custom_site())

<script>
var config = {
  xtermjs: "1", _sdl2: "canvas", user_canvas: 0,
  user_canvas_managed: 0, gui_divider: 1, ume_block: 0, can_close: 0,
  archive: "game", gui_debug: 0,
  cdn: "https://pygame-web.github.io/cdn/0.9.3/", autorun: 0,
  PYBUILD: "3.12", fb_ar: 1.7777778,
  fb_width: 800, fb_height: 450
};
let pendingCommand = '';
const accountId = new URLSearchParams(location.search).get('account') || '';
const storageScope = /^[a-f0-9]{24}$/.test(accountId) ? `cfs:user:${accountId}:` : '';
window.lessonReadCoins = (level) => {
  try {
    if(accountId&&parent!==window&&typeof parent.cfsReadCoins==='function') return parent.cfsReadCoins(level,accountId);
    return localStorage.getItem(storageScope + `cfs:coins:level-${level}:v1`) || '[]';
  }
  catch { return '[]'; }
};
window.lessonSaveCoins = (level, collected) => {
  try { localStorage.setItem(storageScope + `cfs:coins:level-${level}:v1`, collected); }
  catch { /* Keep the current run playable when browser storage is unavailable. */ }
  try { parent.postMessage({channel:'scratch',type:'coins',level,coins:JSON.parse(collected)},location.origin); } catch {}
};
window.lessonTakeCommand = () => { const command = pendingCommand; pendingCommand = ''; return command; };
window.lessonEvent = (raw) => {
  const event = JSON.parse(raw);
  if (event.type === 'ready') window.lessonLoadFinished();
  parent.postMessage({channel: 'scratch', ...event}, '*');
};
window.addEventListener('message', (event) => {
  if (event.source !== parent || !event.data || event.data.channel !== 'scratch') return;
  if (event.data.type === 'compile') {
    pendingCommand = JSON.stringify({body: event.data.body});
    document.getElementById('canvas').focus();
  }
  if (event.data.type === 'key') {
    const {key, down} = event.data;
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(key)) return;
    const code = key === ' ' ? 'Space' : key;
    const keyCode = {ArrowLeft:37, ArrowUp:38, ArrowRight:39, ArrowDown:40, ' ':32}[key];
    document.getElementById('canvas').dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {key, code, keyCode, which: keyCode, bubbles:true}));
  }
});
window.addEventListener('keydown', (event) => { if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(event.key)) event.preventDefault(); });
window.__canvas_resized = () => {};
async function custom_onload() {}
function custom_prerun() {}
function custom_postrun() {}
</script>
